services:
  app:
    build:
      context: .
      dockerfile: docker/staging/app/Dockerfile
    container_name: fms-laravel-staging-app
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8014:80"
    volumes:
      - fms_laravel_staging_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.6
    container_name: fms-laravel-staging-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: db_trucking_system
      MARIADB_USER: fms
      MARIADB_PASSWORD: fms_secret
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "127.0.0.1:3314:3306"
    volumes:
      - fms_laravel_staging_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  fms_laravel_staging_mysql:
  fms_laravel_staging_storage:
