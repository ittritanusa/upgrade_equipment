services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    environment:
      ENV_TEMPLATE_FILE: .env.local.example
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["start-container"]

  frontend-builder:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["sh", "-lc"]
    command: ["npm ci && npm run build && rm -f public/hot"]

  node:
    image: node:22-alpine
    profiles: ["frontend-watch"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: ["sh", "-lc", "npm ci && npm run dev -- --host 0.0.0.0"]

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: db_trucking_system
      MARIADB_USER: fms
      MARIADB_PASSWORD: fms_secret
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_local_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mariadb_local_data:
